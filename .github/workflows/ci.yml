name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Includes the hostile test skills suite (test/hostile); CI fails if any of them gets through.
      - run: bun test
      - name: Validate wrangler config and build both Workers (no deploy)
        run: |
          npx wrangler deploy --dry-run --outdir dist/app
          npx wrangler deploy --dry-run -c wrangler.render.jsonc --outdir dist/render
      - name: Migrations apply cleanly
        run: npx wrangler d1 migrations apply DB --local

  deploy:
    name: Deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Secrets pasted with a trailing newline make wrangler reject the account ID ("Invalid account ID"),
      # so strip whitespace before exporting them to later steps.
      - name: Load Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Create D1 / R2 / queue if missing, fill in database_id
        run: bun scripts/ci-provision.ts
      - run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy app Worker (builds and pushes the sandbox image)
        run: npx wrangler deploy
      - name: Deploy render Worker
        run: npx wrangler deploy -c wrangler.render.jsonc
